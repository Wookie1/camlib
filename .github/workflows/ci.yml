name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        env:
          PYO3_PYTHON: python
      - name: Tests
        run: cargo test --release --workspace --all-features --lib --tests
        env:
          PYO3_PYTHON: python
      - name: Doctests
        run: cargo test --release --doc

  msrv:
    name: Rust 1.88 (minimum supported version) builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-features --all-targets
        env:
          PYO3_PYTHON: python

  python:
    name: Python (ruff, tests with CadQuery)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install CadQuery and ruff
        run: python -m pip install cadquery ruff
      - name: Ruff
        run: |
          ruff check python examples
          ruff format --check python examples
      - name: Build the engine and Python extension
        run: cargo build --release --workspace --all-features
        env:
          PYO3_PYTHON: python
      - name: Tests
        run: python -m unittest discover -s python/tests
        env:
          PYTHONPATH: python
      - name: Examples
        run: |
          python examples/standalone_job.py out
          python examples/cadquery_job.py out-cad
        env:
          PYTHONPATH: python
